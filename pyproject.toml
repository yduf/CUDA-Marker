[project]
name = "marker-project"
version = "0.1.0"
description = "PDF to Markdown pipeline using Marker + GPU"
requires-python = ">=3.10"
dependencies = [
    "marker-pdf",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
